                            <label for="email-add">Email address:</label>
                            <input type="email" name="email" id="email-add">
                            <label for="msg">Message:</label>
                            <textarea name="msg" id="msg"></textarea> <!---I learnt in https://www.w3schools.com/ about <textarea>-->
