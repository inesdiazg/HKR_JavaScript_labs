<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="js/feedback.js" defer></script>
</head>
<body>
    <div id="page-container">
        <div id="content-wrap">
            <div class="nav-bar">
                <p class="site-name">Inés Díaz</p>
                <div class="nav-links">
                    <a href="index.html" target="_blank">Home</a>
                    <a href="about.html" target="_blank">About</a>
                    <a href="projects.html" target="_blank">Projects</a>
                    <a href="contact.html" target="_blank">Contact</a>
                </div>
            </div>

            <header>Contact me</header>

            <main>
                <div class="contact-info">
                    <div class="contact-info-item">
                        <img src="imgs/email-light.png">
                        <a href="mailto:inesdiazg6@gmail.com" target="_blank">inesdiazg6@gmail.com</a>
                    </div>
                    <div class="contact-info-item">
                        <img src="imgs/location-light.png">
                        <p>Madrid, Spain</p>
                    </div>
                    <div class="contact-info-item">
                        <img src="imgs/phone-light.png">
                        <p>+34 612 345 678</p>
                    </div>
                </div>

                <p>Let's get in touch! Send me a message:</p>
                    <!-- Form for GRADE 3 -->
                    <form id="feedback-form" class="form" novalidate>
                        <!-- Full Name -->
                        <div class="form-group">
                            <label for="fullname">Full Name:</label>
                            <input type="text" id="fullname" name="fullname" required>
                            <span class="error-msg" id="error-fullname"></span>
                        </div>

                        <!-- Email -->
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" required>
                            <span class="error-msg" id="error-email"></span>
                        </div>

                        <!-- Topic of Interest -->
                        <div class="form-group">
                            <label for="topic">Topic of Interest:</label>
                            <select id="topic" name="topic" required>
                                <option value="">Please select a topic</option>
                                <option value="portfolio">Portfolio feedback</option>
                                <option value="projects">Collaboration on projects</option>
                                <option value="other">Other</option>
                            </select>
                            <span class="error-msg" id="error-topic"></span>
                        </div>

                        <!-- Comments -->
                        <div class="form-group">
                            <label for="comments">Comments:</label>
                            <textarea id="comments" name="comments" required></textarea>
                            <div class="counter-wrapper">
                                <span id="char-counter" class="counter">0 characters (minimum 15)</span>
                            </div>
                            <span class="error-msg" id="error-comments"></span>
                        </div>

                        <!-- Website (optional) -->
                        <div class="form-group">
                            <label for="website">Website (optional):</label>
                            <input type="url" id="website" name="website">
                            <span class="error-msg" id="error-website"></span>
                        </div>

                        <!-- Buttons -->
                        <div class="form-actions">
                            <button type="submit" class="submit-button">Submit</button>
                            <button type="button" id="clear-btn" class="clear-button">Clear</button>
                        </div>

                        <!-- Status area (success message) -->
                        <div id="status-area" class="status-area" role="status" aria-live="polite"></div>
                    </form>

                <a class="back-home" href="index.html">&#8678; back to Home</a>
            </main>
        </div>

        <footer id="footer">
            <div class="footer-icons">
                <a href="https://www.linkedin.com/in/ines-diaz-garcia/" target="_blank"><img src="imgs/linkedin-light.png"></a>
                <a href="mailto:inesdiazg6@gmail.com" target="_blank"><img src="imgs/email-light.png"></a>
                <a href="https://github.com/" target="_blank"><img src="imgs/github-light.png"></a>
            </div>
            <div class="footer-bottom">
                <p>© Inés Díaz García 2026</p>
                <a href="https://www.osano.com/articles/data-privacy-terms" target=_blank>Privacy terms</a>
            </div>
        </footer>
    </div>
</body>
</html>
